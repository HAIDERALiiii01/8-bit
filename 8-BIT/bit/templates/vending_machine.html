{% extends "bit_base.html" %}
{% block title %}Vending Machine{% endblock %}

{% block content %}
<section class="lobby lobby--narrow">
    <h1 class="marquee">VENDING MACHINE</h1>
    <p class="subtitle">SPEND YOUR COINS</p>

    <div class="vending-shell">
        <div class="vending-shell__window">
            <span>&#129380;</span>
            <span>&#127871;</span>
            <span>&#127918;</span>
        </div>
        <div class="vending-shell__slot"></div>
    </div>

    <p class="coming-soon blink">STOCKING SHELVES -- COME BACK SOON</p>

    <a class="back-link" href="{{ url_for('bit.bit') }}">&larr; Back to lobby</a>
</section>
{% endblock %}
