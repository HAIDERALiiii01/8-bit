{% extends "bit_base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<section class="lobby lobby--narrow">
    <h1 class="marquee">ADMIN DASHBOARD</h1>
    <p class="subtitle">Welcome, {{ session.username }}</p>

    <div class="terminal-box">
        <p class="terminal-line">&gt; system online</p>
        <p class="terminal-line">&gt; no panels configured yet</p>
        <p class="terminal-line blink">&gt; _</p>
    </div>

    <a class="back-link" href="{{ url_for('bit.bit') }}">&larr; Back to lobby</a>
</section>
{% endblock %}
