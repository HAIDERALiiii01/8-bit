{% extends "bit_base.html" %}
{% block title %}8-bit Studios{% endblock %}

{% block content %}
<section class="lobby">
    <h1 class="marquee">WELCOME, {{ session.username|upper }}</h1>
    <p class="subtitle blink">INSERT COIN TO SELECT</p>

    <div class="arcade-row">
        <a href="{{ url_for('bit.games') }}" class="cabinet-card">
            <div class="cabinet-card__screen"><span>&#127918;</span></div>
            <span class="cabinet-card__label">PLAY GAMES</span>
        </a>

        <a href="{{ url_for('bit.vending_machine') }}" class="cabinet-card">
            <div class="cabinet-card__screen"><span>&#129380;</span></div>
            <span class="cabinet-card__label">VENDING MACHINE</span>
        </a>

        {% if session.get('is_admin') %}
            <a href="{{ url_for('bit.dashboard') }}" class="cabinet-card cabinet-card--admin">
                <div class="cabinet-card__screen"><span>&#128295;</span></div>
                <span class="cabinet-card__label">DASHBOARD</span>
            </a>
        {% endif %}
    </div>
</section>
{% endblock %}
